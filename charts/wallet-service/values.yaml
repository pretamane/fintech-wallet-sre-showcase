# Default values for wallet-service.
replicaCount: 2

image:
  repository: 464868388812.dkr.ecr.us-east-1.amazonaws.com/a-bank-wallet-service
  pullPolicy: IfNotPresent
  tag: "1.0.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8080"

podLabels:
  app.kubernetes.io/part-of: a-bank-fintech-suite
  banking.tier: transaction-engine

# Hardened FinTech Pod Security Standards (Restricted Profile)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: wallet.internal.abank.com.mm
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
# Multi-AZ Fault Tolerance & Anti-Affinity
affinity:
  podAntiAffinity:
    # 1. Physical Datacenter (Availability Zone) Anti-Affinity (AWS us-east-1a / us-east-1b / us-east-1c)
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - wallet-service
        topologyKey: topology.kubernetes.io/zone
    # 2. Host Node Anti-Affinity (Never pack replicas on the same physical bare metal node)
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - wallet-service
          topologyKey: kubernetes.io/hostname

# Enterprise Reliability: PodDisruptionBudget (PDB)
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# PCI-DSS v4.0 Micro-Segmentation: Zero-Trust NetworkPolicy
networkPolicy:
  enabled: true

# Local Event-Driven In-Memory Broker (Redis Queue for Edge Staging)
redis:
  enabled: true

# Advanced Burst Autoscaling: KEDA (Proactive Queue-Depth Event-Driven Scaling)
keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 40
  cooldownPeriod: 120
  pollingInterval: 10
  triggerType: "redis" # Options: "redis", "redis-streams", "prometheus", "aws-sqs"
  redis:
    listName: "transactions:incoming"
    listLength: 30
    stream: "transactions:stream"
    consumerGroup: "wallet-processors"
    pendingEntriesCount: 30
  prometheus:
    serverAddress: "http://prometheus-k8s.monitoring.svc:9090"
    metricName: "http_requests_per_second"
    query: "sum(rate(http_requests_total{app='wallet-service'}[1m]))"
    threshold: "100"
  sqsQueueURL: "https://sqs.us-east-1.amazonaws.com/464868388812/a-bank-transaction-ingest"
  awsRegion: "us-east-1"
  targetQueueLength: 30
  authenticationRef: "keda-trigger-auth-aws-sqs"



{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}-wallet-keda
  labels:
    app.kubernetes.io/name: wallet-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-wallet-service
  minReplicaCount: {{ .Values.keda.minReplicaCount | default 2 }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount | default 40 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod | default 120 }}
  pollingInterval: {{ .Values.keda.pollingInterval | default 10 }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0 # Zero latency: scale instantly on promotional bursts
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300 # 5-minute cooloff to prevent flapping
  triggers:
    # 1. AWS SQS Transaction Ingestion Queue Trigger
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ .Values.keda.sqsQueueURL | quote }}
        queueLength: {{ .Values.keda.targetQueueLength | default "30" | quote }}
        awsRegion: {{ .Values.keda.awsRegion | default "us-east-1" | quote }}
        identityOwner: operator
{{- end }}

# ==============================================================================
# A Bank Mobile Wallet - Developer Experience (DevEx) Local Stack
# Full Local Production Parity: DynamoDB Local + Auto-Init + Wallet Service
# Boot full banking ledger on your laptop in 5 seconds with zero cloud dependency
# ==============================================================================
version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Local Amazon DynamoDB Engine (In-Memory ACID Engine)
  # ----------------------------------------------------------------------------
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    container_name: a-bank-dynamodb-local
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "[ $$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/) -eq 400 ] || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Ephemeral Database Bootstrapper (Schema Migration)
  # ----------------------------------------------------------------------------
  dynamodb-init:
    image: amazon/aws-cli:2.15.30
    container_name: a-bank-dynamodb-init
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local_dev_key
      AWS_SECRET_ACCESS_KEY: local_dev_secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'Waiting for local DynamoDB engine...'
      aws dynamodb create-table \
        --table-name a-bank-wallet-idempotency \
        --attribute-definitions AttributeName=IdempotencyKey,AttributeType=S \
        --key-schema AttributeName=IdempotencyKey,KeyType=HASH \
        --billing-mode PAY_PER_REQUEST \
        --endpoint-url http://dynamodb-local:8000 \
        --region us-east-1 2>/dev/null && echo 'DynamoDB table a-bank-wallet-idempotency created successfully!' || echo 'Table already exists, skipping.'
      "

  # ----------------------------------------------------------------------------
  # 3. A Bank Go Wallet Microservice
  # ----------------------------------------------------------------------------
  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: a-bank-wallet-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: "local-devex"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "local_dev_key"
      AWS_SECRET_ACCESS_KEY: "local_dev_secret"
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/wallet-service", "-health-check"] # Or HTTP probe
      interval: 10s
      timeout: 3s
      retries: 3

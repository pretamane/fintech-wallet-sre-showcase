name: FinTech Wallet SRE CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write  # Mandatory for AWS OIDC authentication (Zero-Static-Credentials)

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: a-bank-wallet-service

jobs:
  # ============================================================================
  # Stage 1: Static Analysis, Tests & Helm Linting
  # ============================================================================
  quality-gate:
    name: Code Quality & Helm Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go Format, Vet & Race-Condition Unit Tests
        run: |
          echo "Verifying Go code formatting and static analysis..."
          diff -u <(echo -n) <(gofmt -d .)
          go vet ./...
          echo "Running atomic double-entry ledger & circuit breaker test suite..."
          go test -v -race ./cmd/wallet-service/...

      - name: Set up Helm v3
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Chart Linting (PDB, NetworkPolicy, KEDA, Deployment)
        run: |
          echo "Linting Kubernetes Helm Chart for A Bank standards..."
          helm lint charts/wallet-service/

  # ============================================================================
  # Stage 2: Container Security & Vulnerability Scanning (PCI-DSS Mandate)
  # ============================================================================
  security-scan:
    name: Container CVE Vulnerability Audit (Trivy)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Local Container Image
        run: |
          docker build -t a-bank-wallet-service:${{ github.sha }} .

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'a-bank-wallet-service:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # Stage 3: Infrastructure-as-Code Static Security Analysis (Shift-Left DevSecOps)
  # ============================================================================
  iac-security-scan:
    name: Terraform Security & Policy Audit (tfsec)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Aqua Security tfsec Static Code Analysis
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

  # ============================================================================
  # Stage 4: Build & Push to AWS Elastic Container Registry (ECR)
  # ============================================================================
  deploy-ecr:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: [security-scan, iac-security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC / IAM)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # Supports either GitHub Secrets access keys or AWS OIDC Role ARN
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker container for AWS ECR..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "Pushing image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Pushed successfully: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # ========================================================================
      # Supply Chain Security: Software Bill of Materials (PCI-DSS Req 6.3.2)
      # ========================================================================
      - name: Generate Software Bill of Materials (SBOM) with Syft
        uses: anchore/sbom-action@v0.17.9
        with:
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: spdx-json
          output-file: a-bank-wallet-sbom.spdx.json

      - name: Upload Financial Compliance SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-bank-compliance-sbom-${{ github.sha }}
          path: a-bank-wallet-sbom.spdx.json
          retention-days: 30

# ==============================================================================
# A-Bank Edge Direct Ingress Proxy Nginx Configuration
# Enforces X-Origin-Verify secret token header
# Proxies authenticated requests directly to K3s ClusterIP (10.43.107.40:80)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8088;
        server_name origin-wallet.thaw-zin-2k77.de5.net wallet-direct.archpreta.online _;

        if ($http_x_origin_verify != "21e3ef85801229aec805134e348b0c6522e51213afcdf718") {
            return 403 "Forbidden: Direct Origin Ingress Prohibited\n";
        }

        location / {
            proxy_pass http://10.43.107.40:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
